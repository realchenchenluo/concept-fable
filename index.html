<script>/* 主题在首次绘制前就定下来，避免闪一下。
   优先级：壳通过 #theme= 告知的（APP 里最可靠） → 浏览器里存过的 → 系统日夜。
   注意引擎存的是 JSON，所以这里要先 parse 再比对。 */(function(){try{
var t=null,h=location.hash||"",m=/theme=(day|night)/.exec(h);
if(m)t=m[1];
if(!t){var raw=localStorage.getItem("cf:theme");try{raw=JSON.parse(raw);}catch(e){}if(raw==="day"||raw==="night")t=raw;}
if(!t){
  if(/sys=day/.test(h))t="day";
  else if(/sys=night/.test(h))t="night";
  else t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"night":"day";
}
document.documentElement.setAttribute("data-theme",t);
}catch(e){document.documentElement.setAttribute("data-theme","day");}})();</script>
<script>/* theme-color 只能由 meta 决定，CSS 里的变量传不出去，所以跟着 data-theme 手动同步：
   手机浏览器地址栏 / 添加到主屏幕后的状态栏颜色才不会和页面打架。 */(function(){
var m=document.querySelector('meta[name="theme-color"]');
if(!m)return;
var map={day:"#e9e4d6",night:"#191715"};
function sync(){m.setAttribute("content",map[document.documentElement.getAttribute("data-theme")]||map.night);}
sync();
new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();</script>
