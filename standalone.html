<script>/* 主题在首次绘制前就定下来，避免闪一下。
   优先级：壳通过 #theme= 告知的（APP 里最可靠） → 浏览器里存过的 → 系统日夜。
   注意引擎存的是 JSON，所以这里要先 parse 再比对。 */(function(){try{
var t=null,h=location.hash||"",m=/theme=(day|night)/.exec(h);
if(m)t=m[1];
if(!t){var raw=localStorage.getItem("cf:theme");try{raw=JSON.parse(raw);}catch(e){}if(raw==="day"||raw==="night")t=raw;}
if(!t){
  if(/sys=day/.test(h))t="day";
  else if(/sys=night/.test(h))t="night";
  else t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"night":"day";
}
document.documentElement.setAttribute("data-theme",t);
}catch(e){document.documentElement.setAttribute("data-theme","day");}})();</script>
<script>/* theme-color 只能由 meta 决定，CSS 里的变量传不出去，所以跟着 data-theme 手动同步：
   手机浏览器地址栏 / 添加到主屏幕后的状态栏颜色才不会和页面打架。 */(function(){
var m=document.querySelector('meta[name="theme-color"]');
if(!m)return;
var map={day:"#e9e4d6",night:"#191715"};
function sync(){m.setAttribute("content",map[document.documentElement.getAttribute("data-theme")]||map.night);}
sync();
new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();</script>
<style>
/* ==== style.css ==== */
/* ============================================================================
   概念寓言机 · 样式
   ---------------------------------------------------------------------------
   两套主题（日/夜），靠 html[data-theme] 切换，默认跟随系统。
   配色目标是长时间阅读不刺眼：不用纯白纸 + 纯黑字，对比压低一档，
   夜里用暖灰底（不是纯黑），正文颜色偏米灰。
   ========================================================================== */

:root{
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --fs:1;
  --r:16px;
}

/* ---------- 日间：米灰纸，低对比 ---------- */
html[data-theme="day"]{
  --bg:#e9e4d6;
  --bg-2:#efeade;
  --card:#f3efe4;
  --card-2:#f8f4ea;
  --ink:#34302a;
  --ink-2:#6d675c;
  --ink-3:#9a9284;
  --line:#dad2c0;
  --accent:#a35a38;
  --accent-2:#c07a52;
  --gold:#94793f;
  --moss:#5f7a4c;
  --chipbg:#e4ddca;
  --chipink:#6f6553;
  --fb-no:#f2e7df;
  --fb-ok:#e6ebdc;
  --verdict:#f0e9db;
  --shadow:22px 48px -44px rgba(70,52,28,.85);
  /* 小实验 */
  --bar-a:#b0603a; --bar-b:#94502f;
  --dim-a:#a09a8c; --dim-b:#827c6f;
  --stripe-hi:rgba(192,122,82,.62); --stripe-lo:rgba(192,122,82,.26);
  --skill:#ac9668; --line-dash:#b8a583;
  --flag-g-bg:#e6d3c2; --flag-g-ink:#8d4b2e; --flag-g-line:#d2b49c;
  --flag-b-bg:#e0ded5; --flag-b-ink:#6b665b; --flag-b-line:#cbc7bb;
  /* 旧变量名的别名：概念模块里写了 var(--ember) */
  --ember:var(--accent); --ember-soft:var(--accent-2);
  --paper:var(--bg); --paper-2:var(--card); --ink-soft:var(--ink-2);
}

/* ---------- 夜间：暖灰深色，不是纯黑 ---------- */
html[data-theme="night"]{
  --bg:#191715;
  --bg-2:#1d1b18;
  --card:#221f1b;
  --card-2:#262320;
  --ink:#cfc7b8;
  --ink-2:#958c7e;
  --ink-3:#7a7266;
  --line:#332f29;
  --accent:#d88a5f;
  --accent-2:#a8663f;
  --gold:#bd9d5e;
  --moss:#86a76d;
  --chipbg:#2b2722;
  --chipink:#a2988a;
  --fb-no:#2b2320;
  --fb-ok:#242a20;
  --verdict:#2a2721;
  --shadow:22px 48px -44px rgba(0,0,0,.9);
  --bar-a:#c9764d; --bar-b:#a85d38;
  --dim-a:#6d675d; --dim-b:#54504a;
  --stripe-hi:rgba(216,138,95,.5); --stripe-lo:rgba(216,138,95,.2);
  --skill:#8a7a58; --line-dash:#7d7159;
  --flag-g-bg:#3a2b23; --flag-g-ink:#dfa07c; --flag-g-line:#4d382d;
  --flag-b-bg:#2c2924; --flag-b-ink:#a49a8c; --flag-b-line:#3d3931;
  --ember:var(--accent); --ember-soft:var(--accent-2);
  --paper:var(--bg); --paper-2:var(--card); --ink-soft:var(--ink-2);
}

*{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
  background:var(--bg);
}
body{
  margin:0;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  background:
    radial-gradient(1100px 560px at 50% -8%, var(--card-2) 0%, rgba(0,0,0,0) 62%),
    var(--bg);
  transition:background .3s ease,color .3s ease;
}
/* 极淡的纸纹，夜间关掉（深色下只会显脏） */
html[data-theme="day"] body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.4;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.22'/></svg>");
}

/* ---------- 顶栏 ---------- */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding-top:env(safe-area-inset-top,0px)}
@supports not (background:color-mix(in srgb,red 50%,transparent)){ #bar{background:var(--bg)} }
#bar .row{max-width:min(820px,94vw);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
#bar .k{font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--ink-2);white-space:nowrap}
#bar .k b{color:var(--ink);font-weight:500}
#bar .row .right{display:flex;align-items:center;gap:8px}
#kleft{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog{height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s cubic-bezier(.2,.7,.2,1)}

.tool{font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:var(--accent);white-space:nowrap;
  background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  transition:transform .16s ease,border-color .2s ease}
.tool:hover{transform:translateY(-1px);border-color:var(--accent-2)}
.tool.ghost{color:var(--ink-2)}

/* ---------- 版心 ---------- */
.wrap{max-width:min(820px,94vw);margin:0 auto;padding:92px 0 40vh;position:relative;z-index:2}
.beat{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.beat.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.beat{transition:none;opacity:1;transform:none}}

/* 幕与幕之间给一个呼吸位 */
.scene{position:relative}
.scene + .scene{margin-top:14px}
.scene .scenetag{font-family:var(--sans);font-size:11.5px;letter-spacing:.22em;color:var(--ink-3);
  margin:0 0 22px;display:flex;align-items:center;gap:12px}
.scene .scenetag::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- 封面 ---------- */
.cover{min-height:74vh;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative}
.cover .ghost{position:absolute;inset:0;display:grid;place-content:center;font-size:clamp(220px,54vw,460px);
  color:var(--accent);opacity:.07;line-height:1;user-select:none;pointer-events:none}
.cover h1{font-size:clamp(58px,16vw,112px);line-height:1;margin:0 0 26px;letter-spacing:.08em;font-weight:600;position:relative}
.cover p.sub{font-size:clamp(15px,2.4vw,17px);color:var(--ink-2);line-height:2.05;margin:0 auto;max-width:30em;position:relative}
.cover p.sub .stamp{color:var(--accent)}
.cover p.sub.meta{margin-top:26px;font-size:12.5px;line-height:2;color:var(--ink-3);letter-spacing:.04em}
.cover p.sub.meta b{color:var(--accent)}

/* ---------- 故事正文 ---------- */
.story{font-size:calc(clamp(17.5px,2.6vw,19px) * var(--fs));line-height:2.15;letter-spacing:.015em}
.story p{margin:0 0 1.15em}
.story p:last-child{margin-bottom:0}
.hl{color:var(--accent)}
.story p.hl-line{color:var(--accent);font-weight:600}
.story p.quote-line{margin-left:1.1em;border-left:3px solid var(--gold);padding-left:1.1em;color:var(--ink)}
.ledger{
  margin:1.9em 0;padding:24px 26px;background:linear-gradient(180deg,var(--card-2),var(--card));
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px var(--r) var(--r) 3px;
  box-shadow:0 16px 34px -30px var(--shadow);
  font-size:calc(clamp(16.5px,2.4vw,18px) * var(--fs));line-height:2.1;
}
.ledger .t{font-family:var(--sans);font-size:11.5px;letter-spacing:.2em;color:var(--gold);margin-bottom:12px}
.ledger b{color:var(--accent);font-weight:600}
.ledger .r{margin:.5em 0}

/* ---------- 按钮 ---------- */
.go{display:inline-flex;align-items:center;gap:10px;margin:26px 0 4px;padding:13px 26px;border-radius:999px;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--card-2),var(--card));color:var(--accent);
  font-family:var(--sans);font-size:14px;letter-spacing:.1em;cursor:pointer;
  box-shadow:0 12px 24px -20px var(--shadow);transition:transform .18s ease,box-shadow .25s ease,border-color .2s}
.go:hover{transform:translateY(-1px);border-color:var(--accent-2)}
.go:active{transform:translateY(0)}
.go .arw{transition:transform .25s ease}
.go:hover .arw{transform:translateX(3px)}
.btn{padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--accent);
  font-family:var(--sans);font-size:13.5px;letter-spacing:.08em;cursor:pointer;transition:transform .16s ease,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent-2)}
.btn.ghost{color:var(--ink-2)}

/* ---------- 选择题 ---------- */
.quiz{margin:2.3em 0;padding:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  box-shadow:0 22px 48px -44px var(--shadow)}
.qtag{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:12px}
.qtext{font-size:calc(clamp(17px,2.5vw,18.5px) * var(--fs));line-height:1.95;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:15px 17px;min-height:52px;
  border:1px solid var(--line);border-radius:12px;background:var(--card-2);color:var(--ink);
  font-family:inherit;font-size:calc(16px * var(--fs));line-height:1.8;cursor:pointer;
  transition:transform .16s ease,border-color .2s ease,background .2s ease,opacity .3s ease}
.opt:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent-2)}
.opt .key{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);color:var(--ink-2);
  font-family:var(--sans);font-size:11.5px;display:grid;place-content:center;margin-top:2px;transition:.2s}
.opt.ok{border-color:var(--moss);background:var(--fb-ok)}
.opt.ok .key{background:var(--moss);border-color:var(--moss);color:var(--bg)}
.opt.no{border-color:var(--line);background:var(--fb-no);opacity:.6;text-decoration:line-through;text-decoration-color:var(--accent-2)}
.opt.no .key{background:var(--fb-no);color:var(--ink-2)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:15px 17px;border-radius:12px;font-size:calc(15.8px * var(--fs));line-height:1.95;
  background:var(--card-2);border-left:3px solid var(--line);color:var(--ink);animation:fb .38s cubic-bezier(.2,.7,.2,1)}
.fb.ok{background:var(--fb-ok);border-left-color:var(--moss)}
.fb.no{background:var(--fb-no);border-left-color:var(--accent-2)}
.fb b{color:var(--accent)}
@keyframes fb{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 概念揭示 ---------- */
.reveal{text-align:center;padding:8vh 0 3vh}
.reveal .pre{font-family:var(--sans);font-size:12px;letter-spacing:.28em;color:var(--ink-3);margin-bottom:26px}
.reveal .name{font-size:clamp(42px,11vw,76px);letter-spacing:.1em;margin:0;color:var(--accent);font-weight:600;line-height:1.2}
.reveal .quote{margin:32px auto 0;max-width:26em;font-size:calc(clamp(16px,2.4vw,17.5px) * var(--fs));line-height:2.1;color:var(--ink-2)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:24px 0 4px}
.chip{font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;padding:4px 12px;border-radius:999px;
  background:var(--chipbg);color:var(--chipink);border:1px solid var(--line)}
.chip.en{background:transparent}
.chip.ghostchip{background:transparent;border-style:dashed}

/* ---------- 讲解 ---------- */
.panel{margin:2.2em 0;padding:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  box-shadow:0 22px 48px -44px var(--shadow)}
.panel h2{font-size:11.5px;font-family:var(--sans);letter-spacing:.2em;color:var(--gold);font-weight:400;margin:0 0 16px}
.panel h3{font-size:calc(clamp(19px,2.9vw,22px) * 1);margin:0 0 16px;letter-spacing:.02em}
.panel p{font-size:calc(16.2px * var(--fs));line-height:2.02;margin:0 0 1.05em;color:var(--ink)}
.panel p:last-child{margin-bottom:0}
.panel ul{margin:0 0 1.05em;padding-left:1.15em}
.panel li{font-size:calc(16.2px * var(--fs));line-height:1.98;margin-bottom:.55em;color:var(--ink)}
.panel em{font-style:normal;color:var(--accent);font-weight:600}
.panel code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:var(--chipbg);color:var(--ink);padding:1px 6px;border-radius:5px}
.formula{margin:1.4em 0;padding:18px 20px;border-radius:12px;background:var(--card-2);border:1px dashed var(--line);text-align:center;
  font-family:var(--sans);font-size:15.5px;line-height:2;color:var(--ink)}
.formula b{color:var(--accent)}
.formula span{color:var(--ink-2)!important}

/* ---------- 对照表 ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1.6em 0}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:calc(14.8px * var(--fs))}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);line-height:1.78;vertical-align:top}
th{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:var(--ink-2);font-weight:400}
td:first-child{color:var(--ink);width:42%}
td:last-child{color:var(--ink-2)}
tbody tr:hover{background:var(--card-2)}

/* ---------- 小实验 ---------- */
.rig{margin:2em 0;padding:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.rig .rt{font-family:var(--sans);font-size:11.5px;letter-spacing:.2em;color:var(--gold);margin-bottom:14px}
.rig h3{font-size:calc(clamp(19px,2.9vw,22px) * 1);margin:0 0 12px}
.rig p.intro{font-size:calc(15.8px * var(--fs));line-height:1.98;color:var(--ink);margin:0 0 8px}
.bars{display:flex;align-items:flex-end;gap:clamp(5px,1.6vw,13px);height:230px;margin:22px 0 0;padding:0 0 30px;border-bottom:1px solid var(--line)}
.pot{flex:1;height:100%;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
.pot .luck{background:repeating-linear-gradient(90deg,var(--stripe-hi) 0 3px,var(--stripe-lo) 3px 7px);transition:height .6s cubic-bezier(.2,.7,.2,1)}
.pot .base{background:linear-gradient(180deg,var(--bar-a),var(--bar-b));transition:height .6s cubic-bezier(.2,.7,.2,1),background .3s}
.pot .skillline{position:absolute;left:-3px;right:-3px;border-top:1.6px dashed var(--line-dash);transition:bottom .6s cubic-bezier(.2,.7,.2,1)}
.pot .flag{position:absolute;left:50%;transform:translateX(-50%);margin-bottom:7px;font-family:var(--sans);font-size:10.5px;
  line-height:1;padding:3px 6px;border-radius:999px;opacity:0;transition:bottom .6s cubic-bezier(.2,.7,.2,1),opacity .35s ease}
.pot .flag.q{background:var(--flag-g-bg);color:var(--flag-g-ink);border:1px solid var(--flag-g-line)}
.pot .flag.m{background:var(--flag-b-bg);color:var(--flag-b-ink);border:1px solid var(--flag-b-line)}
.pot .lbl{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-family:var(--sans);font-size:11.5px;color:var(--ink-2)}
.pot.praised .lbl{color:var(--accent);font-weight:600}
.pot.praised .base{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.pot.scolded .lbl{color:var(--ink-2)}
.pot.scolded .base{background:linear-gradient(180deg,var(--dim-a),var(--dim-b))}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--sans);font-size:12px;color:var(--ink-2);margin-top:34px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rigbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.stats{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);font-family:var(--sans);font-size:13px;line-height:2.05;color:var(--ink-2)}
.stats b{color:var(--accent);font-weight:600}
.stats .verdict{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--verdict);border-left:3px solid var(--accent-2);
  font-family:var(--serif);font-size:calc(14.8px * var(--fs));line-height:1.95;color:var(--ink)}

/* ---------- 收尾 ---------- */
.fin{text-align:center;padding:6vh 0 2vh}
.fin .closing{font-size:calc(clamp(18px,2.8vw,22px) * var(--fs));line-height:2.15;max-width:26em;margin:0 auto 30px}
.fin .score{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);letter-spacing:.05em;line-height:2.05}
.fin .score b{color:var(--accent)}
.seal{display:inline-grid;place-content:center;width:74px;height:74px;border:2px solid var(--accent);border-radius:6px;
  color:var(--accent);font-size:34px;margin:0 auto 30px;opacity:.9}

    { tag:"讲解 · 一", h3:"它到底是什么",
      html:[
        "<p><em>一句话：一件事里装着多少不确定，是可以量的；量出来的那个数，就是「把这件事问清楚，平均最少要花多少信息」。单位是比特——一次「是／否」，或者一次「亮／不亮」。</em></p>",
        "<p>把它拆开，只有两步：</p>",
        "<p><b>第一，一次回答只有两种结果。</b>{oracle}能给的只有{ask}。所以{act}最多把剩下的可能分成两堆——不管你怎么安排，一次回答也分不出三堆来。两次四堆，三次八堆，k 次就是 2 的 k 次方堆。反过来推：手里有 N 份可能，最少要 k ≥ log₂N 次。</p>",
        "<p><b>第二，「平均」这两个字很重要。</b>份数翻一倍，只多要一次：一千份要十次，一百万份也只要二十次（2²⁰ ≈ 105 万）。这份「长得慢」不是本事，是这类回答定下的尺子。而且那十次是「最坏情况下」的次数——如果各份的分量不一样（多半不一样），平均下来比它少；少多少，是后面几节的事。</p>",
        "<p>还有一件最容易弄反的事：这个数说的是<b>分布</b>，不是某一次的结果。同一件事，对已经知道内情的人是零，对还在等消息的人是一整笔账。所以要小心「一件事的熵」这种说法——严格讲，熵属于一整套可能的分配，不属于某一条消息。</p>"
      ]},
    { tag:"讲解 · 二", h3:"一条消息值多少：意外才值钱",
      html:[
        "<p>一条消息带多少信息，不看它多长、多重要，看它<b>有多难猜到</b>。写法是 <code>−log₂ p</code>：</p>",
        "<ul>",
        "<li>p = 1/2 → 1 比特；</li>",
        "<li>p = 1/1024 → 10 比特；</li>",

        "</ul>",
        "<p>把每一样东西的「值多少」按它出现的分量加权平均，得到的就是整个分布的平均信息量——也就是熵。所以熵也可以这样读：<b>这一类消息，平均每一条带多少。</b></p>",
        "<p>{common}，几乎每次都猜得到，它值不了多少；{rare}，{span}里碰不上几回，来一次就值一大笔。</p>",

      ]},
    { tag:"讲解 · 三", h3:"分量不一样的时候，不要对半分",
      html:[
        "<p>「每次都砍一半」只在一种情况下最快：剩下的每一份都一样像。等可能的时候，N 份正好对应 log₂N 比特；这时「按个数切一半」和「按分量切一半」是同一件事，两条路重合了。</p>",
        "<p>可现实里很少「一样像」。这时候最好的问法不是按<b>个数</b>切，而是按<b>分量</b>切。</p>",
        "<p>一个例子：一千个可能，其中一个占了九成九。按个数对半分（五百个一边），平均要问两次多；先问那一句『是不是就这一个』，平均一次出头。同一堆可能，两种问法，平均成本差了一倍——差的不是个数，是分量。所以一次回答值多少，看的是它切掉了多少<b>可能</b>，不是切掉了多少个<b>格子</b>。</p>",
        "<p>个数和分量，是两个答案——{successor}绕的那一大圈，绕的就是这个。</p>",
        "<p>顺便说一句，把这件事做成一张码表的常用办法叫霍夫曼编码：反复把两个最小的分量并成一枝，直到长出整棵树。它给出的平均码长最多比熵多不到 1 比特——这是能保证的最好结果，也是几乎所有压缩软件的骨架。</p>"

    { tag:"讲解 · 四", h3:"它和压缩，是同一件事",
      html:[
        "<p>「把答案问出来」和「把消息说出去」，是同一件事的两种说法。问，是从一堆可能里收紧到一条；说，是把挑出来的那一条传给别人。两头用的是同一笔账。</p>",
        "<p>所以香农（Claude Shannon）1948 年那篇《通信的数学理论》里最要紧的一条是：<b>任何无损编码的平均码长，都不可能短于熵。</b>你可以贴着它走，可以做到「熵 ≤ 平均码长 &lt; 熵 + 1」，但你过不去。</p>",

        "<div class=\"formula\"><b>Σ 2<sup>−lᵢ</sup> ≤ 1</b><br><span style=\"color:#6f6459;font-size:13.5px\">码越短，它占掉的「分量预算」越大。短码是稀缺资源，所以它必须留给最常出现的东西。</span></div>",
        "<p>还有一句要分清的：熵管的是<b>无损</b>的下界。如果你允许丢掉一点（有损压缩），下界就不是熵了，是另一个量（率失真函数）——照片和视频能压到十分之一，靠的是「允许丢」这一条。</p>"
      ]},
    { tag:"讲解 · 五", h3:"它在哪里出现",
      html:[
        "<ul>",
        "<li><b>二十个问题</b>：2²⁰ ≈ 105 万，所以「猜一个一百万的数」二十问就够，十亿以内也只要三十问。可多数人的第一问是『是不是 3』——那一问只砍掉一个数；该问的是『比五十万大吗』。</li>",
        "<li><b>考试的选择题</b>：四选一最多 2 比特，但前提是四个选项在你眼里真的一样可能。你一上手就排除掉两个，这道题带的信息就只有 1 比特；干扰项不像，实际信息还要更少。所以「题难」和「信息量大」是两件事——真正决定信息量的，是拿到题干之前你已经能划掉哪几个选项。</li>",
        "<li><b>A/B 实验要算样本量</b>：你要分辨的差别越小，需要的信息越多，样本就越大，而且不是线性——效应小一半，样本大约要四倍。样本量就是在买比特；样本不够的时候，两次读数之间的差别大半是噪声——那不是发现，是比特不够。</li>",
        "<li><b>密码强度</b>：一个随机口令的强度，标准答案就是一个比特数：48 位就是 2⁴⁸ 种可能。它不是字符数，也不是「看着乱」——<code>Tr0ub4dor&amp;3</code> 的熵可能还不如四个随机单词。而且这个数永远是相对某个猜测者的模型说的：换一个对手，账就换了。</li>",
        "<li><b>工程上的「先知道极限」</b>：通信有信道容量，先知道这条线最多能传多少，才知道自己差多远；压缩前先估一估熵，才知道还剩多少空间可挤；机器学习里的交叉熵损失、决策树的信息增益、语言模型的困惑度，是同一个量换了几身衣服（困惑度 100，意思是模型在每一步上，相当于在一百个一样可能的选择里犹豫）。</li>",
        "<li><b>一项检查值多少</b>：一项化验、一张片子值多少比特，看它能把诊断的分布改变多少。结果只有阳性和阴性两种，所以它最多告诉你两次「是／否」——跟它做得多贵、机器多先进没有关系。</li>",
        "</ul>"
      ]},
    { tag:"讲解 · 六", h3:"它不是什么",
      html:[
        "<p><b>它不是单个结果的性质，是分布的性质。</b>说「这条消息的熵」是句病句；单条消息有的是「这个分布下它的信息量」，熵是一整套分量的账。</p>",
        "<p><b>它不是「混乱程度」。</b>这个说法是从热力学借来的比喻，含糊得什么都能装。熵说的是<b>观测者不知道多少</b>：一副洗好的牌，对洗牌的人是零，对你是 log₂52 ≈ 5.7 比特。{place}里等消息的人，和千里之外睡熟了的人，面对的是同一件事，装着的「不知道」却不一样多。你闭上眼睛，熵上升；你偷看一眼，它就塌掉。它不是东西的属性，是「谁知道多少」的属性。</p>",
        "<p><b>它不是「随机」的同义词。</b>一枚偏得厉害的硬币照样随机，它的熵比一枚均匀硬币小得多。随机说的是「猜不到」；熵量的是<b>有多猜不到</b>。</p>",

        "<p>把它拆开，只有两条：</p>",

        "<p><b>第二，「细」就是自由度。</b>一条规矩越细，它能同时容下的情形就越多；规矩的条数一旦接近资料的条数，任何一批资料都能被描得严丝合缝。于是在旧资料上，规矩越多越准——<em>这个「越准」是必然的，它什么都证明不了</em>。真正的问题只有一个：换一批没见过的资料，它还准不准。</p>",

         why:"这一条最顺手，但它对不上：{book}里成千上万笔，{span}一天没落下。他不是随手抓了几个例子。<b>他不是看得太少，是看得太齐——齐得可疑。</b>请记住这里，后面会讲到，为什么这个毛病不是靠「把样本做大」能治好的。"},
        {key:"B", text:"确认偏误：他只记得住合他心意的例子，把不合心意的忘了。",
         why:"方向很接近，差在一个要紧的地方：确认偏误问的是<b>你会不会去找反例</b>；而在这里，他手边根本没有反例可找。凡是能反驳这条规矩的，都不在那本{book}里——不是他忘了，是没有人往下记过。"},
        {key:"C", text:"事后归因：先后发生的两件事，被他当成了因果。",
         why:"时间顺序并没有错。麻烦在于：就算把他推理的每一步都做对，只要材料还是这份材料，结论一个字都不会变。<b>病不在他推理的那几步，在他脚下的那一批样本。</b>"},
        {key:"D", text:"这份记录本身是一道筛子的产物：只有通过筛选的那一部分才会被写进去，所以他读到的那条规律，可能只是筛子留下的形状。", ok:true,
         why:"关键在于材料的来路：{book}不是谁的花名册，是一份功劳簿。能进去的，都是先通过了同一道筛选的。所以那条规律至少有两种可能——它可能是原因，也可能是那道筛子留下的形状。<b>要分辨这两种，你需要知道谁没有进来。</b>剩下的故事，就是有人终于去数了那个数。"}

    { id:"q2", qtag:"停顿二 · 关于那个算出来的数",
      q:"{successor}把{roster}和{book}并排放在一起，算出了{tally}。这一步的要害是什么？",

        {key:"B", text:"说明只要样本再多一些、记的年头再长一些，这条规矩就会被自动纠正。",

        {key:"C", text:"说明少掉的只是少数，可以忽略不计。",

        {key:"D", text:"这是一张分母：{book}只记了通过筛选的那一部分，而{roster}把没通过的那一部分也算了进来——那条规矩到这一步才第一次有了被检验的资格。", ok:true,
         why:"在拿到这个数之前，「{rule}」这句话既不算对也不算错——它只是从来没有被检验过。{successor}做的最要紧的事，不是推翻了{master}，而是<b>第一次让缺失的那一部分有了一个数目</b>。<br>这一步放在哪里都一样：先问「总共该有多少」，再谈「留下来的有多少」。"}

    { id:"q3", qtag:"停顿三 · 给它一个名字",
      q:"故事就快讲完了。现在，请给它一个名字。它是什么？",
      options:[
        {key:"A", text:"确认偏误",
         why:"确认偏误说的是：人会不自觉地去找合心意的证据、躲开不合心意的。可{master}不需要去找——他手边那份材料里，反例从来没有出现过。这不是一个人的视野有毛病，是有一整块东西<b>根本不在</b>。<br>修法也不同：确认偏误要你「主动去找反例」，而这个要你「去找那些没有被留下来的人」。前者是态度的功课，后者是取样的功课。"},
        {key:"B", text:"回归均值",
         why:"回归均值说的是：被挑出来的极值里混着运气，下一次它会往中间走。这里没有「下一次」——没回来的{goer}不会再有下落，这种缺席是永久的，而且安静。<br>一个讲的是<b>测量里的噪声</b>，一个讲的是<b>样本里的空缺</b>。"},
        {key:"C", text:"选择性偏差",
         why:"这是最该停一下的选项，因为它是正确答案的亲属。<br>「选择性偏差」是一整个家族的名字：志愿者偏差、无回应偏差、便利抽样，都能挂上去。它的成员通常还留着一点线索——你至少知道有人没填问卷、有人在名单外。而这一段里的缺口更窄、更硬：<b>被筛掉的那部分，从结果那一端开始就已经不在名单上了，你连漏了谁都说不出。</b>所以它不是给数据加个权就能补的，只能回到入口，从头再跟一遍——补救动作不一样，名字就该分开叫。"},
        {key:"D", text:"幸存者偏差", ok:true,
         why:"<code>你看到的样本 = 全体 − 被筛选掉的部分</code>，而被筛掉的原因，恰好和你研究的那个结果有关。<br>三个要点：<b>一、筛选发生在结果之后</b>——先有成败，才决定谁被记下来；<b>二、能不能被记下来，取决于成败本身</b>，所以偏差有方向，不会互相抵消；<b>三、缺口的规模常常无人知道</b>——{successor}能算出{tally}，已经算是运气极好的。<br>最要紧的一句：<b>它不会因为样本变大而变好。</b>"}
      ]}

  /* ---------------------------------------------------------------- 揭示 */
  reveal: {
    pre: "所以，这个故事讲的是",
    quote: "后人把{master}留下的那本{book}叫《{storyTitle}》。给它起学名的人，把它叫做 <b style=\"color:var(--ember)\">survivorship bias</b>。<br>下面几节，把这个概念拆干净：它在什么条件下才致命、它和「以偏概全」差在哪里、以及遇到它的时候该拿它怎么办。"
  },

  /* ---------------------------------------------------------------- 讲解 */
  panels: [
    { tag:"讲解 · 一", h3:"它到底是什么",
      html:[
        "<p><em>一句话：你手里那份材料，并不是「所有发生过的事」，而是「通过了同一道筛选之后还剩下的那部分」。只从剩下的这部分总结出来的规律，可能只是那道筛子的形状。</em></p>",
        "<p>拆开看，是三个条件，缺一个都不成立：</p>",
        "<p><b>一、有一道筛选。</b>{book}里只有{survivor}——先通过了，才有资格被写进去。</p>",
        "<p><b>二、能不能通过，和你研究的那个结论有关。</b>你要回答的那个问题，本身就是「什么让它走到最后」；而能不能被写进{book}，恰恰也是被同一件事决定的。</p>",
        "<p><b>三、没通过的那部分，是没有记录的。</b>不是少，是没有：{missing}，{book}上一个字都没有。</p>",
        "<p>真正的样子在第三条。{successor}能算出{tally}，已经算是运气极好——大多数时候，你连缺了多少都不知道，因为没有任何人替你数过。<em>它最凶的地方，是它不留痕迹。</em></p>"
      ]},
    { tag:"讲解 · 二", h3:"它什么时候才致命（以及它和「以偏概全」差在哪里）",
      html:[
        "<p><b>缺失本身不可怕，可怕的是缺失和结论有关。</b>如果没回来的{goer}是随机的——纯粹抽签抽到了谁——那么剩下的样本照样能拿来估计全体，只是误差大一点、话说得软一点。统计上这叫随机缺失，它是可以被算进误差里去的。</p>",
        "<p>致命的是另一种：<b>能不能留下来，取决于你要测量的那件事本身。</b>那么留在样本里的那部分，在任何跟你研究的问题有关的指标上都会系统性地偏向一边，而偏向的方向，就是筛选的方向。到这一步，样本再大也没有用——它只是让一个错误的估计变得更精确。</p>",
        "<p><b>所以它和「以偏概全」不是一回事。</b>以偏概全的毛病在于<em>偏</em>：随手抓了一小把就当成全体，解药是「多取一点、随机一点」。而这个毛病的样本可以非常非常大：{book}上的数成千上万，{span}一天没落下。<b>它的病不在多少，在来路。</b>那一部分样本的入选条件，和你研究的结论，是同一件事。你把它扩大十倍，扩大的还是同一道筛子的产物。</p>",
        "<p>还有一层比上面所有话都冷：<b>消失是可以被制造出来的。</b>只要「让不合格的人离开记录」比「让不合格的人变合格」容易——而它几乎总是更容易——就一定会有人去做。这条斜路一开，规矩就会越来越漂亮，因为它每漂亮一分，都有人替它清一次场。</p>"
      ]},
    { tag:"讲解 · 三", h3:"它最危险的几个场合",
      html:[
        "<p><b>一、经验传承。</b>凡是「一代代传下来」的东西，都天然经过了一道筛选：成功的那批人有故事，失败的那批人没有故事。祖训、家学、行帮的规矩、老兵的忠告、商业传记、成功学——全都长在这块地基上，而且大多真诚、大多管用。<br>{master}的{ledBy}就是这样一份材料：一个字不假，而且只有赢家的账。它在很多时候确实帮到了人——只是起作用的道理，和它以为的那个不一样。</p>",
        "<p><b>二、从结果那一端往回收集数据。</b>这是它在当代最常见的样子，而且常常是别人替你收好的：基金数据库里只有还没清盘的基金；回测里只有今天还在的股票；事故档案里只有出过事故的机器；疗效表里只有回来复诊的病人；网页寿命统计里只有今天还打得开的网页；只在有标签的样本上训练模型，而标签只存在于「当初被标注成功」的那一部分里。</p>",
        "<p><b>还有一件更近的事：你的每一次评估，都在给下一次喂食。</b>推荐系统只对被展示过的内容拿到反馈，没被展示的永远没有数据；于是模型越来越确信它一开始的偏好，越来越把资源压在它已经喜欢的东西上。这个圈在业内叫反馈回路，但它就是同一个毛病换了一件衣服：<b>你看见的世界，是被你自己的选择筛过一遍的世界。</b></p>"
      ]},
    { tag:"讲解 · 四", h3:"那怎么办：一句自检，四个动作",
      html:[
        "<p><b>自检只有一句话：这个数字里，谁不在？</b>——不问「样本多大」，问「样本是怎么进来的」。这一句问得出来，八九成的问题自己就露头了。</p>",
        "<p>防它的全部要点也只有一句：<b>做比较的时候，你必须知道没看到的那部分去了哪里。</b>下面四个动作，按顺序做：</p>",
        "<ul>",
        "<li><b>一、先找分母，再看结论。</b>任何一份名单，先问它当初总共该有多少。{successor}做的全部事情，其实就是把{roster}和{book}并排放在了一起——很多争论吵了几十年，缺的只是这一张纸。</li>",
        "<li><b>二、用入口名单，别用整理好的记录。</b>整理过的记录是给人看的，它往往只留下体面的部分；而入口名单（出港登记、报名簿、订单、住院登记）当初是为了别的用途写的，反倒更可能老老实实记着所有人。你要问的只有一句：<em>当初进来的一共多少？</em></li>",
        "<li><b>三、从入口往前跟，而不是从结果往回看。</b>从结果往回看，你永远只能看见走到终点的人；从入口往前跟，每一个人都会有一个下落，哪怕下落是「不知道去哪了」——「不知道去哪了」也是数据，而且往往是关键的那一个。</li>",
        "<li><b>四、给消失留一行位置。</b>这一条是制度层面的，也最管用：基金清盘要留档，临床试验要事先注册并全部公开（包括做出来是阴性的那些），退市要留数据，被砍掉的项目要复盘，退学的要记去向。{successor}给{missing}留的那个位置，就是这一条。<b>只要「不在」被记成一条记录，它就不能再偷偷地起作用了。</b></li>",
        "</ul>",
        "<p>最后还有一个动作最便宜，也最少有人做：<b>换一个问法。</b>不要问「成功的人有什么共同点」，要问——「如果这个共同点真有用，那么在没成功的人身上，它的比例应该更低。」然后去数。这个「去数」，就是全部的功夫。</p>"
      ]},
    { tag:"讲解 · 五", h3:"它在哪里真的出现过",
      html:[
        "<ul>",
        "<li><b>二战战机（招牌案例）。</b>1943 年，美军统计研究小组分析返航轰炸机的弹孔：机翼和机身密密麻麻，发动机、油箱、驾驶舱几乎干干净净。多数军官的结论是加固弹孔最多的地方。瓦尔德的结论正好相反——<b>该加固的是没有弹孔的地方</b>：打中那里的飞机，根本就没有回来。他那份报告的名字朴素得很：《根据幸存者的损伤估计飞机易受攻击的部位》。<br>顺便说一句：这个故事在流传里已经走样了，最常见的版本把结论说反。它自己也经历过一次筛选。</li>",
        "<li><b>软件与算法。</b>埋点只收得到「还能把 App 打开的人」——闪退到打不开的那批用户，一个字都没留下；A/B 实验只统计走完流程的人，在埋点触发之前就走掉的不算；评测集只留下「能被标注出来」的样本，标不出来的那些被丢掉，而它们往往是最难的。这些都是每天都在发生的事，而且通常不叫「偏差」，叫「数据清洗」。</li>",
        "<li><b>工程与安全。</b>「我们这套架构三年没出过大事故」——说这话的团队，是活着的那批；用同一套架构出事的团队，人和文档都散了。事故复盘永远只复盘出过事故的系统，同一个设计里没出事的那一半，没有人写报告。桥梁、管道、飞机的服役记录，记的都是还没有塌的那些。</li>",
        "<li><b>招聘。</b>「我们的人都很能扛」——因为扛不住的已经离职了，而离职的人不会进在职员工的画像。只研究在职高管的履历（名校、早起、爱读传记），你一定会得到一份很漂亮的共同点清单；把没走到这个位置的人的同一份清单拿来对照，才叫对照。</li>",
        "<li><b>金融。</b>基金数据库会不断删掉清盘和被合并的产品，于是「行业平均历史收益」被系统性高估；用今天还活着的股票做历史回测，退市公司的数据常常是缺的，而退市的多半是差公司——光这一步，就能把回测的年化收益抬高好几个百分点。</li>",
        "<li><b>医疗。</b>只在「回来复诊的病人」身上评估疗效，可失访的人系统性更差，他们不会回来，也就不会有数据。一个科室如果想，还可以通过拒收重症，把手术成功率做得很好看。</li>",
        "<li><b>两个不太正经的。</b>为什么古典音乐的平均水准比当代高——因为平庸的曲子不再演了；为什么两千年前的古罗马建筑都特别结实——因为不结实的都已经塌了。两句都对，两句是同一个东西。</li>",
        "</ul>"
      ]},
    { tag:"讲解 · 六", h3:"这个词的来路，和它的几个邻居",
      html:[
        "<p>「幸存者偏差」这个名字是 1940 年代在纽约定下来的：统计研究小组给军方算飞机该往哪里加装甲，那种「只有通过筛选的人才进得了统计」的结构被写进了报告，后来就叫了这个名字。<br>给它做这道题的人叫沃尔德，1950 年死在印度上空一次坠机里，四十八岁。</p>",
        "<p>下面几个名字经常被混在一起，而它们的区别正好是有用之处：</p>",
        "<p><b>确认偏误</b>——毛病出在你的<b>检索</b>上：你会去找合心意的证据、躲开不合心意的。解药是态度上的：主动去找反例。<br><b>幸存者偏差</b>——毛病出在<b>材料</b>上：反例不在你手里，它从来没有进来过。解药是取样上的：去找那些没有被留下来的东西。这是两个层面的病，吃的不是一种药。</p>",
        "<p><b>选择性偏差</b>——幸存者偏差所属的那个大家族：志愿者偏差、无回应偏差、便利抽样都在里面。它通常还留着线索，你至少知道有人没填问卷。而幸存者偏差更窄、更硬：缺口从结果那一端就已经存在，你连漏了谁都说不清，也没法靠加权补回来——只能回到入口，重新跟一遍。</p>",
        "<p><b>发表偏倚</b>——做过统计的人会想到它，而且是对的：期刊只收阳性结果，没做出来的研究躺在抽屉里。那不是比喻，那是这个毛病在学术界最标准的形态，所以现在要「预注册」。</p>",
        "<p><b>回归均值</b>——这个最容易和它混。回归均值讲的是同一个人身上，运气不会重复；幸存者偏差讲的是整整一批人，从来没有出现在记录里。一个是测量里的噪声，一个是样本里的空缺。</p>"
      ]}
  ],

        "<p>原因是势垒随尺度长，而系统手里的涨落不随尺度长：热涨落给的只有 kT，量子隧穿给的是一个和尺度基本无关的振幅。于是越过势垒的速率被尺度指数压低：<code>Γ ∝ e<sup>-cN</sup></code>（热激活的写法是 <code>e<sup>-ΔE/kT</sup></code>，而这里的 ΔE 又正比于 N）。多一个数量级，就少好几个数量级。</p>",
        "<p><b>由此得到这个概念的严格边界，也是很多人第一次学时会写错的地方：严格的自发破缺只在热力学极限（N→∞）下成立。</b>对任何有限系统，真正的基态永远是对称的那一个组合——两个等价态对称、反对称地叠起来，能量差 <code>Δ ∝ e<sup>-cN</sup></code>。所以在有限体积里，严格地说，对称从来没有破缺过。</p>",
        "<p>那为什么我们看到的现象这么像破缺？因为对大而有限的系统，Δ 小得荒唐：任何一点杂质、任何一点外场、任何一点和环境的耦合，都比它大。再加上退相干——宏观系统跟环境缠在一起，对称的叠加很快就变成「其实只是不知道在哪一边」的混合态。<b>于是「事实上」破缺了，「严格地说」没有。</b>两句话都得说：只说前一句，就解释不了{smallN}为什么一直在换；只说后一句，就看不见{bigN}为什么一次也没有动过。</p>",
        "<p>顺带一句：连续对称在 d ≤ 2 且 T > 0 时根本破缺不了——Goldstone 模的涨落会把长程序抹平（Mermin–Wagner）。破缺这件事还挑维度。</p>"
      ]},
    { tag:"讲解 · 四", h3:"连续的会留下一条不收钱的路，离散的没有",
      html:[
        "<p>破缺的方式有两类，差别很大。</p>",

        "<p>能隙为零是普遍的，色散的形状则看破缺的类型：反铁磁体、超流、晶体里是线性的 <code>ω = ck</code>；铁磁体里是 <code>ω ∝ k²</code>（总磁化是守恒量，属于另一类 Goldstone）。但「零」是一样的：把波数推向零，频率就推向零。</p>",

        "<p><b>在规范理论里，这条路会被吃掉。</b>如果那个对称不是整体的，而是每一点各自独立的（规范对称），Goldstone 模就不再是一个独立的粒子——它变成规范玻色子的纵向极化。账很好算：无质量的规范场有两个极化，有质量的要三个，多出来的那一个就是原来的 Goldstone 自由度。W 和 Z 的质量就是这么来的：Higgs 场提供的是一个有期望值的「方向」，而「吃掉」是规范场自己在自由度上记的一笔账。</p>",

      html:[
        "<p>只要有一样外部的东西偏好某一个方向——一个外磁场、一块衬底给晶格的取向、一块挂在近处的磁石——选向就不再是任意的了。这种破缺是<b>显式</b>的：对称从一开始就不在（规则本身偏了），也就谈不上「系统自己选」。</p>",

    { tag:"讲解 · 六", h3:"序参量、畴与畴壁，以及「冻」出来的缺陷",
      html:[

        "<p>这则故事最容易被搬到别处去用——惯例、制度、标准、协议、口音。搬的时候要分清哪些是真的。</p>",
        "<p><b>真的成立的部分：</b>①一族严格等价的选项，没有哪一条更优；②一个微小的、早到的、本身无关紧要的事件决定了落在哪一个（{trigger}）；③一旦落定，换回去的代价随参与者规模增长，于是宏观上不可逆；④可以定义一个序参量，描述某个区域里「大家走哪一条」；⑤两个区域相遇的地方有边界成本（{wall}）；⑥外部的偏好会把「任意」变成「指定」，强度小到几乎看不见也够用。</p>",

        "<p>所以正确的用法是：借它的词汇（简并、涨落、序参量、畴壁、锁定、淬火），然后老老实实承认自己还没有写出哈密顿量，也没有说清 N 是什么。词汇是免费的，定理不是。</p>"

<script>
/* ==== engine.js ==== */
/* ============================================================================
   概念寓言机 · 引擎
   ---------------------------------------------------------------------------
   内容全部来自概念模块（concepts/*.js）。引擎负责：
     抽一组（概念 × 故事）→ 解析槽位 → 排队 → 逐条渲染 → 判题 → 揭示 → 拆解

   为手机自用做的四件事：
     1. 进度记忆   —— localStorage 记住这一则读到第几幕、哪几题答过，切出去再回来接着读
     2. 拇指操作   —— 手机上「继续」是底部固定条，不用去正文末尾找
     3. 字号三档   —— 小/中/大，记在本地
     4. 抽签历史   —— 优先抽没读过的；全读完再按最久没读的轮换

   排版标记（只作用于故事正文）：
     段落以 {hl} 开头 → 强调行；以 〔引〕 开头 → 引文行
   ========================================================================== */
(function () {
"use strict";

var CONCEPTS = (window.CONCEPTS || []).slice();
var stage = document.getElementById("stage");
var prog = document.getElementById("prog");
var kleft = document.getElementById("kleft");
var kright = document.getElementById("kright");
var foot = document.getElementById("foot");
var shuffleBtn = document.getElementById("shuffle");
var fontBtn = document.getElementById("fontbtn");
var fsLabel = document.getElementById("fslabel");
var themeBtn = document.getElementById("themebtn");
var barEl = document.getElementById("actionbar");
var barBtn = document.getElementById("actionbtn");

if (!CONCEPTS.length) {
  stage.innerHTML = '<div class="panel" style="margin-top:18vh"><h3>没有读到任何概念模块</h3>' +
    '<p>请确认 <code>concepts/</code> 下的 .js 文件已经在这个页面里用 <code>&lt;script src&gt;</code> 引入。' +
    '用 file:// 直接打开、或者用本地服务器访问都可以。</p></div>';
  return;
}

/* ------------------------------------------------------------------ 工具 */
function el(tag, cls, html) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function pick(v) { return Array.isArray(v) ? v[Math.floor(Math.random() * v.length)] : v; }
function fill(s, slots) {
  return String(s == null ? "" : s).replace(/\{([a-zA-Z][a-zA-Z0-9_]*)\}/g, function (m, k) {
    return slots[k] === undefined ? m : slots[k];
  });
}
function fillNode(node, slots) {
  var walk = function (x) {
    if (x.nodeType === 3) {
      if (x.nodeValue.indexOf("{") >= 0) x.nodeValue = fill(x.nodeValue, slots);
    } else if (x.nodeType === 1 && x.tagName !== "SCRIPT" && x.tagName !== "STYLE") {
      Array.prototype.forEach.call(x.childNodes, walk);
    }
  };
  Array.prototype.forEach.call(node.childNodes, walk);
}

/* ------------------------------------------------------- 本地存储 */
var KEY = { sess: "cf:session", hist: "cf:history", font: "cf:font", theme: "cf:theme", last: "cf:last" };
var SESSION_V = 2;   // 存档格式版本：幕的切分方式变了就 +1，旧存档会被忽略
var LS = {
  get: function (k, d) {
    try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
    catch (e) { return d; }
  },
  set: function (k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ------------------------------------------------- 1 · 字号（小/中/大） */
var FS = ["0", "1", "2"], FSNAME = ["小", "中", "大"];
var fsIdx = FS.indexOf(String(LS.get(KEY.font, "1")));
if (fsIdx < 0) fsIdx = 1;
function applyFont() {
  document.documentElement.setAttribute("data-fs", FS[fsIdx]);
  if (fsLabel) fsLabel.textContent = FSNAME[fsIdx];
  if (fontBtn) fontBtn.title = "字号：" + FSNAME[fsIdx] + "（点一下换下一档）";
}
if (fontBtn) fontBtn.addEventListener("click", function () {
  fsIdx = (fsIdx + 1) % 3;
  LS.set(KEY.font, FS[fsIdx]);
  applyFont();
});
applyFont();

/* ------------------------------------------------ 2 · 日间 / 夜间配色 */
function curTheme() {
  return document.documentElement.getAttribute("data-theme") === "night" ? "night" : "day";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  if (themeBtn) {
    themeBtn.innerHTML = t === "night"
      ? '<span class="gl">☀</span><span class="lbl">日间</span>'
      : '<span class="gl">☾</span><span class="lbl">夜间</span>';
    themeBtn.title = t === "night" ? "现在是夜间，点一下切回日间" : "现在是日间，点一下切到夜间";
  }
  var m = document.querySelector('meta[name="theme-color"]');
  if (!m) { m = document.createElement("meta"); m.setAttribute("name", "theme-color"); document.head.appendChild(m); }
  m.setAttribute("content", t === "night" ? "#191715" : "#e9e4d6");
  // 套在安卓 WebView 壳里时，把状态栏/导航栏一起换掉（浏览器里没有这个对象，静默跳过）
  try { if (window.AndroidApp && AndroidApp.setTheme) AndroidApp.setTheme(t); } catch (e) {}
}
if (themeBtn) themeBtn.addEventListener("click", function () {
  var t = curTheme() === "night" ? "day" : "night";
  LS.set(KEY.theme, t);
  applyTheme(t);
});
applyTheme(curTheme());

/* ---------------------------------------------------- 4 · 抽签与历史 */
function hist() { return LS.get(KEY.hist, {}) || {}; }
function skey(cid, si) { return cid + "#" + si; }
function totalStories() {
  return CONCEPTS.reduce(function (a, c) { return a + (c.stories || []).length; }, 0);
}
function readCount() {
  var h = hist(), n = 0;
  Object.keys(h).forEach(function (k) { if (h[k] && h[k].done) n++; });
  return n;
}
function markSeen(cid, si) {
  var h = hist(), k = skey(cid, si);
  if (!h[k]) h[k] = { t: Date.now(), n: 0, done: false };
  h[k].t = Date.now(); h[k].n = (h[k].n || 0) + 1;
  LS.set(KEY.hist, h);
}
function markDone(cid, si) {
  var h = hist(), k = skey(cid, si);
  if (!h[k]) h[k] = { t: Date.now(), n: 1, done: false };
  h[k].done = true;
  LS.set(KEY.hist, h);
}

function roll() {
  var h = hist(), last = LS.get(KEY.last, null);
  var all = [];
  CONCEPTS.forEach(function (c) {
    (c.stories || []).forEach(function (s, i) { all.push({ cid: c.id, si: i }); });
  });
  var unread = all.filter(function (x) { return !h[skey(x.cid, x.si)]; });
  var pool = unread.length ? unread : all.slice().sort(function (a, b) {
    var ea = h[skey(a.cid, a.si)] || { t: 0 }, eb = h[skey(b.cid, b.si)] || { t: 0 };
    return ea.t - eb.t;
  });
  var cand = pool.filter(function (x) {
    return !last || x.cid !== last.cid || x.si !== last.si;
  });
  if (!cand.length) cand = pool;
  var chosen = cand[Math.floor(Math.random() * cand.length)];
  LS.set(KEY.last, chosen);
  return chosen;
}

/* ----------------------------------------------------------- 构建一组 */
var G = null;          // 当前这一组
var action = null;     // 当前可点的动作（继续/下一节/…）
var actionWrap = null; // 正文里那个按钮的容器

function build(opt) {
  var c, si, slots, i0 = 0, answers = {};
  if (opt && opt.resume) {
    c = CONCEPTS.filter(function (x) { return x.id === opt.resume.cid; })[0];
    if (!c) { opt = null; }
    else {
      si = Math.min(opt.resume.si, c.stories.length - 1);
      slots = opt.resume.slots || {};
      i0 = opt.resume.i || 0;
      answers = opt.resume.answers || {};
    }
  }
  if (!c) {
    var r = roll();
    c = CONCEPTS.filter(function (x) { return x.id === r.cid; })[0];
    si = r.si;
    slots = {};
    var st0 = c.stories[si];
    for (var k in st0.slots) slots[k] = pick(st0.slots[k]);
  }

  var story = c.stories[si];
  // 一幕 = 连续的若干个 beat，遇到分幕标题或题目就断开
  var plan = [{ kind: "cover" }];
  var scene = null;
  (story.beats || []).forEach(function (b) {
    if (!scene || b.chapter) {
      scene = { kind: "scene", beats: [], chapter: b.chapter };
      plan.push(scene);
    }
    scene.beats.push(b);
    if (b.after) {
      var q = (c.quiz || []).filter(function (x) { return x.id === b.after; })[0];
      if (q) { plan.push({ kind: "quiz", q: q }); scene = null; }
    }
  });
  plan.push({ kind: "reveal" });
  // 讲解 + 对照表合成一篇，一次给出，读者自己往下滚
  plan.push({ kind: "article", panels: (c.panels || []).slice(), table: !!c.table });
  plan.push({ kind: "finish" });

  G = {
    c: c, si: si, story: story, slots: slots, plan: plan,
    i: Math.min(i0, plan.length - 1),
    answers: answers,
    quizTotal: 0,
    quizFirst: 0,
    instant: false
  };
  Object.keys(answers).forEach(function (qid) {
    if (answers[qid] && answers[qid].done) {
      G.quizTotal++;
      if (answers[qid].first) G.quizFirst++;
    }
  });
  markSeen(c.id, si);
  return G;
}

function saveSession() {
  if (!G) return;
  // 记「当前正在看的是哪一条」：next() 里已经 ++ 过，所以减一
  var at = G.i - 1;
  if (at <= 0) return;                 // 还在封面，不必记
  LS.set(KEY.sess, {
    v: SESSION_V, cid: G.c.id, si: G.si, slots: G.slots, i: at, answers: G.answers
  });
}

/* -------------------------------------------------------------- 动作条 */
function syncBar() {
  if (!barEl) return;
  if (action) { barEl.classList.add("on"); if (barBtn) barBtn.innerHTML = '<span>' + action.label + '</span><span class="arw">→</span>'; }
  else barEl.classList.remove("on");
}
function placeAction(container, label, fn) {
  clearAction(true);
  action = { label: label, fn: fn };
  if (container) {
    actionWrap = el("div", "actwrap");
    var b = el("button", "go inline-go", '<span>' + label + '</span><span class="arw">→</span>');
    b.type = "button";
    b.addEventListener("click", fireAction);
    actionWrap.appendChild(b);
    container.appendChild(actionWrap);
  }
  syncBar();
}
function clearAction(silent) {
  if (actionWrap && actionWrap.parentNode) actionWrap.parentNode.removeChild(actionWrap);
  actionWrap = null; action = null;
  if (!silent) syncBar();
}
function fireAction() {
  if (!action) return;
  var fn = action.fn;
  clearAction();
  fn();
}
if (barBtn) barBtn.addEventListener("click", fireAction);

/* ---------------------------------------------------------------- 渲染 */
function mount(node, scroll, instant) {
  node.classList.add("beat");
  stage.appendChild(node);
  if (instant) {
    node.classList.add("in");
    node.style.transition = "none";
    return node;
  }
  requestAnimationFrame(function () { requestAnimationFrame(function () { node.classList.add("in"); }); });
  if (scroll !== false) setTimeout(function () {
    var top = node.getBoundingClientRect().top + window.pageYOffset - 150;
    window.scrollTo({ top: Math.max(top, 0), behavior: "smooth" });
  }, 60);
  return node;
}
function setProgress() {
  var n = Math.min(G.i, G.plan.length);
  prog.style.width = (n / G.plan.length * 100).toFixed(1) + "%";
  var cnt = document.querySelector("#bar .cnt");
  if (cnt) cnt.innerHTML = "<b>" + n + "</b> / " + G.plan.length;
}
function setChapter(t) { kleft.textContent = t; }

/* 安卓返回键 / 浏览器后退：回到上一幕，而不是退出 */
function pushHistory(at) {
  if (at > 0) { try { history.pushState({ cf: at }, ""); } catch (e) {} }
}
function jumpTo(at) {
  if (!G) return;
  start({ resume: { cid: G.c.id, si: G.si, slots: G.slots, i: at, answers: G.answers } });
}
window.addEventListener("popstate", function (ev) {
  if (!G) return;
  var st = ev.state, at = (st && typeof st.cf === "number") ? st.cf : 0;
  if (at < G.i) jumpTo(at);
});

function next() {
  if (!G || G.i >= G.plan.length) return;
  var item = G.plan[G.i++];
  setProgress();
  saveSession();
  pushHistory(G.i - 1);
  render(item);
}

function renderLedger(items, slots) {
  var box = el("div", "ledger"), titled = false;
  items.forEach(function (it) {
    if (it.t && !titled) { box.appendChild(el("div", "t", fill(it.t, slots))); titled = true; }
    if (it.r) box.appendChild(el("div", "r", fill(it.r, slots)));

}

function renderScene(item) {

function renderCover() {

    '<br><span class="stamp">猜错了也没关系——猜错的地方，正是这个概念最常骗过人的地方。</span>'));

    CONCEPTS.length + ' 个概念 · 抽签会优先给没读过的' +

function renderQuiz(item) {
  var q = item.q, slots = G.slots;
  var saved = G.answers[q.id];
  var n = el("div", "quiz");
  n.appendChild(el("div", "qtag", fill(q.qtag || "停顿", slots)));
  if (q.intro) n.appendChild(el("div", "fb", fill(q.intro, slots)));
  n.appendChild(el("div", "qtext", fill(q.q, slots)));
  var box = el("div", "opts"), fbBox = el("div"), solved = false;

  q.options.forEach(function (o) {
    var btn = el("button", "opt", '<span class="key">' + o.key + '</span><span>' + fill(o.text, slots) + '</span>');
    btn.type = "button";

    // —— 上次已经答对的题：静态呈现当时的结果，不重答
    if (saved && saved.done) {
      btn.disabled = true;
      if (o.ok) {
        btn.classList.add("ok");
        solved = true;
        fbBox.innerHTML = "";
        fbBox.appendChild(el("div", "fb ok", "<b>这道题上次答对了。</b>" + fill(o.why, slots)));
      } else if (saved.wrong && saved.wrong.indexOf(o.key) >= 0) {
        btn.classList.add("no");
      }
      box.appendChild(btn);
      return;
    }
    // —— 这道题上次没答完：点错的划掉；回放时整体只作展示，
    //    但如果它就是当前这一条，剩下的选项保持可点，接着答
    if (saved && !saved.done) {
      var wasWrong = saved.wrong && saved.wrong.indexOf(o.key) >= 0;
      if (wasWrong) btn.classList.add("no");
      if (wasWrong || G.instant) {
        btn.disabled = true;
        box.appendChild(btn);
        return;
      }
    }

    btn.addEventListener("click", function () {
      if (solved || btn.disabled) return;
      if (o.ok) {
        solved = true;
        btn.classList.add("ok");
        Array.prototype.forEach.call(box.querySelectorAll(".opt"), function (x) { if (x !== btn) x.disabled = true; });
        fbBox.innerHTML = "";
        fbBox.appendChild(el("div", "fb ok", "<b>答对了。</b>" + fill(o.why, slots)));
        var rec = G.answers[q.id] || { wrong: [], first: true };
        rec.first = !rec.wrong.length;
        rec.done = true;
        G.answers[q.id] = rec;
        saveSession();
        placeAction(n, "带着这个继续读", next);
        setTimeout(function () {
          var top = fbBox.getBoundingClientRect().top + window.pageYOffset - 200;
          window.scrollTo({ top: Math.max(top, 0), behavior: "smooth" });
        }, 80);
      } else {
        btn.classList.add("no");
        btn.disabled = true;
        var rec = G.answers[q.id] || { wrong: [], first: true };
        if (rec.wrong.indexOf(o.key) < 0) rec.wrong.push(o.key);
        rec.first = false;
        G.answers[q.id] = rec;
        saveSession();
        fbBox.innerHTML = "";
        fbBox.appendChild(el("div", "fb no", "<b>再想想。</b>" + fill(o.why, slots)));
      }
    });
    box.appendChild(btn);
  });

  n.appendChild(box);
  n.appendChild(fbBox);
  // 上次就答对的题：这次不用再答，直接给「继续」
  if (solved && !G.instant && !action) placeAction(n, "带着这个继续读", next);
  mount(n, true, G.instant);
}

// 讲解 + 对照表一次给出：这是一篇文章，读者自己往下滚，不必一节一节点
function renderArticle(item) {

function renderFinish() {
  var c = G.c;
  markDone(G.c.id, G.si);

  var n = el("div", "fin");

    "这一则的 " + (G.c.quiz || []).length + " 处停顿，你一次答对了 <b>" + G.quizFirst + "</b> 处。" +
    "<br>已读 <b>" + readCount() + "</b> / " + totalStories() + " 则。" +
    "<br><br>「这次好不好」和「这个人怎么样」，是两个问题。<br>换一则故事，同一个概念会换一副面孔。"));
  var row = el("div", "rigbtns");
  row.style.justifyContent = "center";
  row.style.marginTop = "34px";
  var b1 = el("button", "go", '<span>再生成一个故事</span><span class="arw">↺</span>');
  b1.type = "button";
  b1.addEventListener("click", function () { restart(true); });
  var b2 = el("button", "btn ghost", "重读这一则");
  b2.type = "button";
  b2.addEventListener("click", function () { restart(false); });
  row.appendChild(b1); row.appendChild(b2);
  n.appendChild(row);
  mount(n, true, G.instant);
  if (foot) foot.style.display = "block";
}

function render(item, opt) {
  if (opt && opt.instant) G.instant = true;
  switch (item.kind) {
    case "cover":   renderCover(); break;
    case "scene":   renderScene(item); break;
    case "quiz":    renderQuiz(item); break;
    case "reveal":  renderReveal(); break;
    case "article": renderArticle(item); break;
    case "finish":  renderFinish(); break;
  }
  if (opt && opt.instant) G.instant = false;
}

/* --------------------------------------------------- 小实验：烧一窑 */
function buildRig(root, label) {
  var NAME = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
  // 真实手艺刻意排得几乎一样高：让「被夸的人手艺本来就好」这个解释没法成立，
  // 名次几乎全由运气决定，回归效应才看得干净。
  var skill = [55, 55.8, 56.6, 57.2, 57.8, 58.4, 59, 59.6, 60.2, 61];
  var N = skill.length, LUCK = 60, MAX = 128, TOP = 2;
  var prev = null, praisedPrev = [], scoldedPrev = [], lastPraise = [], rounds = 0;
  var acc = { p: { n: 0, sum: 0 }, s: { n: 0, sum: 0 }, o: { n: 0, sum: 0 } };

  var bars = el("div", "bars"), pots = [];
  for (var i = 0; i < N; i++) {
    var pot = el("div", "pot");
    var skillline = el("div", "skillline");
    skillline.style.bottom = (skill[i] / MAX * 100) + "%";
    var luck = el("div", "luck"), base = el("div", "base"), flag = el("div", "flag");
    pot.appendChild(skillline); pot.appendChild(luck); pot.appendChild(base);
    pot.appendChild(flag); pot.appendChild(el("div", "lbl", NAME[i]));
    bars.appendChild(pot);
    pots.push({ pot: pot, base: base, luck: luck, flag: flag });
  }

  var legend = el("div", "legend",
    '<span><i style="background:linear-gradient(180deg,var(--bar-a),var(--bar-b))"></i>真实水平（永不变）</span>' +
    '<span><i style="background:repeating-linear-gradient(90deg,var(--stripe-hi) 0 3px,var(--stripe-lo) 3px 7px)"></i>这一轮的运气（每次都重掷）</span>' +
    '<span><i style="border-top:1.6px dashed var(--line-dash);background:none;border-radius:0;height:0;width:14px;vertical-align:4px"></i>水平线</span>' +
    '<span><i style="background:var(--flag-g-bg);border:1px solid var(--flag-g-line);border-radius:999px"></i>这一轮被' + label.good + '的两位</span>' +
    '<span><i style="background:var(--flag-b-bg);border:1px solid var(--flag-b-line);border-radius:999px"></i>这一轮被' + label.bad + '的两位</span>');

  var btns = el("div", "rigbtns");
  var b1 = el("button", "btn", "摇一轮"), b3 = el("button", "btn", "连摇十轮"), b2 = el("button", "btn ghost", "重置");
  b1.type = b3.type = b2.type = "button";
  btns.appendChild(b1); btns.appendChild(b3); btns.appendChild(b2);
  var stats = el("div", "stats", "");
  root.appendChild(bars); root.appendChild(legend); root.appendChild(btns); root.appendChild(stats);

  var fmt = function (v) { return (v >= 0 ? "+" : "") + v.toFixed(1); };
  var avg = function (a) { return a.n ? a.sum / a.n : null; };

  function paint() {
    var p = avg(acc.p), s = avg(acc.s), o = avg(acc.o), v;
    if (rounds === 0) {
      stats.innerHTML = '<div class="verdict">点一下「摇一轮」。十个人的真实水平几乎一样，名次几乎全由运气决定——你马上会看到那位师傅看见了什么。</div>';
      return;
    }
    if (rounds === 1) {
      v = "看清楚：这一轮被" + label.good + "的是 <b>" + lastPraise.map(function (i) { return NAME[i]; }).join("、") +
          "</b>，可看他们的<b>水平线</b>——并不比别人高。他们靠的是这一轮的运气，而运气下一轮就没了。";
    } else if (acc.p.n < 10) {
      v = "三组数字现在还在一起跳：被" + label.good + "的 " + fmt(p) + " 分，被" + label.bad + "的 " + fmt(s) +
          " 分，其余人 " + fmt(o) + " 分。<b>它现在很可能是反的，也可能乱得什么都看不出来——这不是算错，" +
          "这正是那位师傅栽跟头的地方：</b>单次的结果几乎说明不了任何事。重复的次数够多，方向才会露出来。" +
          "再多点几次「摇一轮」，或者直接点「连摇十轮」。";
    } else {
      v = "被<b>" + label.good + "</b>过的（共 " + acc.p.n + " 人次）下一轮平均 <b>" + fmt(p) + "</b> 分；被<b>" + label.bad +
          "</b>过的（共 " + acc.s.n + " 人次）平均 <b>" + fmt(s) + "</b> 分；其余人（" + acc.o.n + " 人次）平均 <b>" + fmt(o) +
          "</b> 分。这三组人做的事完全一样，唯一的区别是：在上一轮里，他们被挑出来过。" +
          "<br><br>这就是那位师傅记了几十年的东西。他会把它记成规律，写成簿子，然后教一百年。";
    }
    stats.innerHTML = "已摇 <b>" + rounds + "</b> 轮　·　累计人次：被" + label.good + " <b>" + acc.p.n +
      "</b> ／ 被" + label.bad + " <b>" + acc.s.n + "</b> ／ 其余 <b>" + acc.o.n + "</b>" +
      '<div class="verdict">' + v + "</div>";
  }

  function fire() {
    rounds++;
    var res = skill.map(function (si) { return si + Math.random() * LUCK; });
    res.forEach(function (r, i) {
      pots[i].base.style.height = (skill[i] / MAX * 100) + "%";
      pots[i].luck.style.height = ((r - skill[i]) / MAX * 100) + "%";
    });
    if (prev) {
      res.forEach(function (r, i) {
        var d = r - prev[i];
        if (praisedPrev.indexOf(i) >= 0) { acc.p.n++; acc.p.sum += d; }
        else if (scoldedPrev.indexOf(i) >= 0) { acc.s.n++; acc.s.sum += d; }
        else { acc.o.n++; acc.o.sum += d; }
      });
    }
    var order = res.map(function (r, i) { return [r, i]; })
      .sort(function (a, b) { return b[0] - a[0]; })
      .map(function (x) { return x[1]; });
    praisedPrev = order.slice(0, TOP);
    scoldedPrev = order.slice(-TOP);
    lastPraise = praisedPrev;
    pots.forEach(function (p, i) {
      var isP = praisedPrev.indexOf(i) >= 0, isS = scoldedPrev.indexOf(i) >= 0;
      p.pot.classList.toggle("praised", isP);
      p.pot.classList.toggle("scolded", isS);
      p.flag.className = "flag " + (isP ? "q" : "m");
      p.flag.textContent = isP ? label.good : (isS ? label.bad : "");
      p.flag.style.opacity = (isP || isS) ? "1" : "0";
      p.flag.style.bottom = (res[i] / MAX * 100) + "%";
    });
    prev = res;
    paint();
  }

  b1.addEventListener("click", fire);
  b3.addEventListener("click", function () { for (var k = 0; k < 10; k++) fire(); });
  b2.addEventListener("click", function () {
    prev = null; praisedPrev = []; scoldedPrev = []; lastPraise = []; rounds = 0;
    acc.p.n = acc.p.sum = acc.s.n = acc.s.sum = acc.o.n = acc.o.sum = 0;
    pots.forEach(function (p) {
      p.luck.style.height = "0%";
      p.pot.classList.remove("praised");
      p.pot.classList.remove("scolded");
      p.flag.style.opacity = "0";
    });
    paint();
  });
  paint();
}

/* ------------------------------------------------------------ 启动/重开 */
function start(opt) {
  stage.innerHTML = "";
  clearAction();
  if (foot) foot.style.display = "none";
  if (opt && opt.resume) {
    build({ resume: opt.resume });
    setChapter("《" + G.story.title + "》");
    // 回放已经读过的部分：不加动画、不滚屏、不再放动作按钮
    var upTo = G.i;
    G.instant = true;
    for (var k = 0; k < upTo; k++) render(G.plan[k]);
    G.instant = false;
    G.i = upTo;
    setProgress();
    saveSession();
    window.scrollTo({ top: 0 });
    setTimeout(function () {
      var last = stage.lastElementChild;
      if (last) {
        var top = last.getBoundingClientRect().top + window.pageYOffset - 110;
        window.scrollTo({ top: Math.max(top, 0), behavior: "smooth" });
      }
    }, 120);
    if (G.i >= G.plan.length) return;
    render(G.plan[G.i++]);
    setProgress();
    return;
  }
  build(opt);
  setChapter("《" + G.story.title + "》");
  setProgress();
  window.scrollTo({ top: 0 });
  next();
}
function restart(again) {
  if (again) LS.del(KEY.sess);          // 换一则：丢掉续读点
  clearAction();
  start(again ? {} : { resume: { cid: G.c.id, si: G.si, slots: G.slots, i: 0, answers: {} } });
}
if (shuffleBtn) shuffleBtn.addEventListener("click", function () { restart(true); });

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
  if (action) { e.preventDefault(); fireAction(); }
});

/* 启动：有没读完的续读点就接着读，否则抽一则新的 */
(function boot() {
  var s = LS.get(KEY.sess, null);
  var ok = !!(s && s.v === SESSION_V && s.i > 0);
  if (ok) {
    var c = CONCEPTS.filter(function (x) { return x.id === s.cid; })[0];
    ok = !!c && !!(c.stories || [])[s.si];
  }
  if (ok) start({ resume: s }); else start({});
})();
})();

</script>
<!-- SCRIPTS:END -->

<script>/* 分享：手机上交给系统分享面板，桌面上复制链接。
   文案里不点破概念，免得替朋友剧透。 */(function(){
var b=document.getElementById("sharebtn"); if(!b) return;
var title=document.title, url=location.href.split("#")[0];
var text="每次打开都是一则新的寓言故事：它一直在讲某个概念，但不会一开始就告诉你。";
b.addEventListener("click",function(){
  if(navigator.share){ navigator.share({title:title,text:text,url:url}).catch(function(){}); return; }
  var old=b.textContent;
  var done=function(){ b.textContent="已复制"; setTimeout(function(){ b.textContent=old; },1400); };
  var s=title+" "+url;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(done,function(){}); return; }
  var i=document.createElement("input"); i.value=s; document.body.appendChild(i); i.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(i);
});
})();</script>

<script>/* 离线：把外壳交给 service worker 缓存，断网也能读。
   file:// 打开（standalone / APK 内嵌页）时不注册，直接跳过。 */(function(){
if(!("serviceWorker" in navigator)) return;
var ok = location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1";
if(!ok) return;
addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();</script>
